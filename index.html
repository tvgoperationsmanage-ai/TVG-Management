<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3b171b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="assets/tvg-logo.png">
<link rel="apple-touch-icon" href="assets/tvg-logo.png">
<link rel="manifest" href="manifest.json">
<link rel="preconnect" href="https://www.gstatic.com" crossorigin>
<link rel="stylesheet" href="styles.css">
<title>TVG Management</title>
</head>
<body>
<div id="splash" class="splash">
  <img src="assets/tvg-logo.png" alt="TVG logo">
  <div class="splash-title">TVG Management</div>
  <div class="splash-sub">HR • Attendance • Workforce Operations</div>
</div>

<div id="login" class="login">
  <div class="login-card glass">
    <img class="login-logo" src="assets/tvg-logo.png" alt="TVG">
    <div class="brand-title">TVG Management</div>
    <div class="muted center">Employee &amp; Operations Management</div>
    <form id="loginForm" novalidate>
      <label>Email<input id="email" type="email" autocomplete="username" required placeholder="employee@tvg.com"></label>
      <label>Password<input id="password" type="password" autocomplete="current-password" required placeholder="Password"></label>
      <button id="loginBtn" class="btn primary wide" type="submit">Sign in</button>
      <button id="forgotBtn" class="link-btn" type="button">Forgot password?</button>
      <div id="loginError" class="error center"></div>
    </form>
    <div class="login-note">Use the email/password account created in Firebase Authentication.</div>
  </div>
</div>

<div id="app" class="hidden">
<header class="topbar">
  <div class="top-left"><button id="menuToggle" class="icon-btn menu-btn" title="Menu">☰</button><div class="brand-mini"><img src="assets/tvg-logo.png" alt=""><div><b>TVG</b><span>Management</span></div></div></div>
  <div class="top-right"><span id="rolePill" class="pill"></span><span id="notificationBellHost"></span><button id="installAppBtn" class="icon-btn install-btn" title="Install TVG app" aria-label="Install TVG app">⇩</button></div>
</header>
<div class="shell">
  <aside id="side" class="side">
    <div class="nav-group"><div class="nav-label">Workspace</div>
      <button data-view="dashboard" class="nav active">⌂ <span>Dashboard</span></button>
      <button data-view="employees" class="nav management">♙ <span>Employees</span></button>
      <button data-view="locations" class="nav management">⌖ <span>Shops &amp; Cities</span></button>
      <button data-view="employeeReport" class="nav management">▥ <span>Employee Reports</span></button>
      <button data-view="attendance" class="nav">◷ <span>Attendance</span></button>
      <button data-view="leaves" class="nav">◫ <span>Leaves</span></button>
      <button data-view="applications" class="nav">✉ <span>Applications</span></button>
    </div>
    <div class="nav-group management"><div class="nav-label">HR Operations</div>
      <button data-view="manpower" class="nav">◉ <span>Manpower</span></button>
      <button data-view="recruitment" class="nav">◎ <span>Recruitment</span></button>
      <button data-view="onboarding" class="nav">＋ <span>Onboarding</span></button>
      <button data-view="performance" class="nav">↗ <span>Performance</span></button>
      <button data-view="training" class="nav">◇ <span>Training</span></button>
      <button data-view="shifts" class="nav">◫ <span>Shifts &amp; Schedules</span></button>
      <button data-view="assets" class="nav">▣ <span>Assets</span></button>
      <button data-view="expenses" class="nav">▤ <span>Expenses</span></button>
      <button data-view="travel" class="nav">✈ <span>Travel</span></button>
      <button data-view="payroll" class="nav">₨ <span>Payroll Register</span></button>
      <button data-view="letters" class="nav">▤ <span>HR Letters</span></button>
      <button data-view="separation" class="nav">→ <span>Separation</span></button>
    </div>
    <div class="nav-group management"><div class="nav-label">Control</div>
      <button data-view="reports" class="nav">▥ <span>Reports</span></button>
      <button data-view="alerts" class="nav">◌ <span>Alerts</span></button>
      <button data-view="audit" class="nav">✓ <span>Audit Trail</span></button>
      <button data-view="settings" class="nav">⚙ <span>Settings</span></button>
    </div>
    <div class="side-footer"><button id="logout" class="side-logout" type="button">↪ <span>Sign out</span></button></div>
  </aside>
  <main id="content"></main>
</div>
<nav class="bottom-nav">
  <button data-view="dashboard" class="nav active">⌂<span>Home</span></button>
  <button data-view="attendance" class="nav">◷<span>Attendance</span></button>
  <button data-view="leaves" class="nav">◫<span>Leaves</span></button>
  <button data-view="applications" class="nav">✉<span>Requests</span></button>
  <button data-view="employees" class="nav management">♙<span>People</span></button>
</nav>
</div>
<div id="modalRoot"></div>
<div id="toastRoot"></div>
<script>
window.addEventListener("error", function(e){
  const box=document.getElementById("loginError");
  if(box && e && e.message) box.textContent="TVG startup error: "+e.message;
});
window.addEventListener("unhandledrejection", function(e){
  const box=document.getElementById("loginError");
  const reason=e && e.reason ? (e.reason.message || String(e.reason)) : "Unknown startup error";
  if(box) box.textContent="TVG startup error: "+reason;
});
</script>
<script>document.addEventListener("click",e=>{const p=document.getElementById("notificationPanel"),w=document.querySelector(".notification-wrap");if(p&&w&&!w.contains(e.target))p.classList.add("hidden")});</script>
<script>
window.addEventListener('load', () => {
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', {scope: './'}).catch(err => console.warn('TVG service worker registration failed:', err));
  }
});
</script>
<script>
window.__tvgInstallPrompt=null;
window.addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__tvgInstallPrompt=e;});
</script>
<script type="module" src="app.js"></script>
<noscript><div class="noscript-warning">JavaScript is required for TVG Management. Please enable JavaScript in your browser.</div></noscript>
</body>
</html>
